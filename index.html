<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saint D. Wish - Home</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .font-title { font-family: 'Cinzel', serif; }
    .space-bg { background: radial-gradient(circle at center, #0b1a35 0%, #030712 100%); }
    .neon-btn {
      background: rgba(10, 25, 50, 0.4); border: 2px solid #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5), inset 0 0 15px rgba(59, 130, 246, 0.3);
      backdrop-filter: blur(5px); transition: all 0.3s ease; position: relative; overflow: hidden; cursor: pointer;
    }
    .neon-btn:hover {
      transform: scale(1.02); box-shadow: 0 0 25px rgba(59, 130, 246, 1), inset 0 0 20px rgba(59, 130, 246, 0.8);
      border-color: #60a5fa; background: rgba(10, 25, 50, 0.6);
    }
    .neon-btn:active { transform: scale(0.98); }
    .neon-btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: all 0.5s;
    }
    .neon-btn:hover::before { left: 100%; }
  </style>
</head>
<body class="space-bg text-white min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

  <div class="absolute inset-0 z-0 opacity-60 bg-cover bg-center" style="background-image: url('bg.jpg');"></div>

  <div class="relative z-10 w-full max-w-md px-8 flex flex-col items-center">
    
    <div class="w-64 md:w-[320px] mb-8 flex justify-center items-center drop-shadow-[0_0_30px_rgba(59,130,246,0.7)] relative z-10">
        <img src="logo.png" alt="Saint D. Wish Logo" class="w-full h-auto object-contain">
    </div>

    <!-- Tombol Login -->
    <a href="login.html" class="neon-btn w-full py-4 rounded-full flex items-center justify-between px-8 mb-6 group">
      <span class="font-title text-xl tracking-wider mx-auto text-blue-100">Login</span>
      <div class="w-8 h-8 rounded-full border border-blue-300 flex items-center justify-center group-hover:bg-blue-500/30 transition">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </div>
    </a>

    <div class="flex items-center w-full mb-6">
      <div class="flex-1 h-px bg-blue-500/30"></div>
      <span class="px-4 text-sm text-blue-200 tracking-widest font-light">Belum Punya Akun ?</span>
      <div class="flex-1 h-px bg-blue-500/30"></div>
    </div>

    <!-- Tombol Sign Up -->
    <a href="signup.html" class="neon-btn w-full py-4 rounded-full flex items-center justify-center mb-16">
      <span class="font-title text-xl tracking-wider text-blue-100">Sign in</span>
    </a>

  </div>
</body>
</html>
