<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saint D. Wish - Login</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome (Ikon) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Poppins', sans-serif; }
    
    /* Efek Background & Elemen Melayang (Neumorphism) */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, #e6f0fa, #c2d9f5);
      box-shadow: 10px 10px 30px rgba(0, 0, 0, 0.05), -10px -10px 30px rgba(255, 255, 255, 0.8);
      z-index: -1;
    }
    
    /* Bayangan halus untuk input & box */
    .neo-input {
      background: rgba(255, 255, 255, 0.5);
      box-shadow: inset 2px 2px 5px rgba(255, 255, 255, 0.7), inset -2px -2px 5px rgba(0, 0, 0, 0.05), 4px 4px 10px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    
    .neo-btn {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      box-shadow: 0 10px 20px -5px rgba(79, 172, 254, 0.5);
    }

    .neo-social {
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.05), -4px -4px 10px rgba(255, 255, 255, 0.8);
      transition: all 0.3s ease;
    }
    .neo-social:hover {
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.05), -2px -2px 5px rgba(255, 255, 255, 0.8);
      transform: translateY(2px);
    }
  </style>
</head>
<body class="bg-[#e8f0fe] min-h-screen flex items-center justify-center relative overflow-hidden">

  <!-- Dekorasi Background Bulat -->
  <div class="bg-shape w-64 h-64 top-[-5%] left-[-5%]"></div>
  <div class="bg-shape w-40 h-40 top-[20%] right-[-5%]"></div>
  <div class="bg-shape w-72 h-72 bottom-[-10%] right-[10%]"></div>
  <div class="bg-shape w-48 h-48 bottom-[-5%] left-[5%]"></div>

  <!-- Main Container -->
  <div class="w-full max-w-[400px] px-6 py-10 relative z-10">
    
    <!-- Tombol Dark Mode Toggle (Kanan Atas) -->
    <div class="absolute top-0 right-6 neo-social w-10 h-10 rounded-xl flex items-center justify-center cursor-pointer">
      <i class="fa-solid fa-moon text-[#0f172a]"></i>
    </div>

    <!-- Logo -->
    <div class="flex justify-center mb-6 mt-4">
      <div class="w-28 h-28 neo-input rounded-3xl flex items-center justify-center overflow-hidden">
        <!-- Kamu bisa ganti ikon ini dengan tag <img> logo asli kamu nanti -->
        <i class="fa-solid fa-fire text-6xl text-blue-500 drop-shadow-lg" style="background: linear-gradient(to bottom, #4facfe, #0052d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
      </div>
    </div>

    <!-- Judul -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-[#0f172a] mb-2 tracking-wide">Welcome Back</h1>
      <p class="text-sm tracking-[0.2em] text-gray-500 uppercase">Sign in to continue</p>
    </div>

    <!-- Form Login -->
    <form action="#" method="POST">
      
      <!-- Input Email -->
      <div class="neo-input rounded-2xl flex items-center px-4 py-3 mb-5">
        <i class="fa-regular fa-user text-gray-500 w-6 text-lg"></i>
        <input type="email" placeholder="Username or Email" class="bg-transparent border-none outline-none w-full ml-3 text-gray-700 placeholder-gray-500 text-sm" required>
      </div>

      <!-- Input Password -->
      <div class="neo-input rounded-2xl flex items-center px-4 py-3 mb-4">
        <i class="fa-solid fa-lock text-gray-500 w-6 text-lg"></i>
        <input type="password" placeholder="Password" class="bg-transparent border-none outline-none w-full ml-3 text-gray-700 placeholder-gray-500 text-sm" required>
        <i class="fa-regular fa-eye-slash text-gray-500 cursor-pointer hover:text-blue-500"></i>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="flex justify-between items-center mb-6 px-1">
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" class="hidden peer">
          <div class="w-5 h-5 rounded border-2 border-blue-500 flex items-center justify-center peer-checked:bg-blue-500 transition-colors">
            <i class="fa-solid fa-check text-white text-xs opacity-0 peer-checked:opacity-100"></i>
          </div>
          <span class="ml-2 text-sm text-gray-700 font-medium">Remember Me</span>
        </label>
        <a href="#" class="text-sm font-semibold text-blue-600 hover:text-blue-800">Forgot Password?</a>
      </div>

      <!-- Tombol Login -->
      <button type="submit" class="neo-btn w-full py-4 rounded-full text-white font-semibold text-lg flex justify-between items-center px-6 relative overflow-hidden group">
        <span class="mx-auto">Login</span>
        <div class="absolute right-4 bg-white/20 w-8 h-8 rounded-full flex items-center justify-center group-hover:bg-white/40 transition">
          <i class="fa-solid fa-arrow-right text-white"></i>
        </div>
      </button>

    </form>

    <!-- Divider -->
    <div class="flex items-center my-8">
      <div class="flex-1 h-px bg-gray-300"></div>
      <span class="px-4 text-xs tracking-widest text-gray-500 uppercase">Or continue with</span>
      <div class="flex-1 h-px bg-gray-300"></div>
    </div>

    <!-- Sosial Media -->
    <div class="flex justify-center gap-4 mb-8">
      <button class="neo-social w-16 h-16 rounded-2xl flex items-center justify-center">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="w-6 h-6">
      </button>
      <button class="neo-social w-16 h-16 rounded-2xl flex items-center justify-center text-[#5865F2] text-2xl">
        <i class="fa-brands fa-discord"></i>
      </button>
      <button class="neo-social w-16 h-16 rounded-2xl flex items-center justify-center text-[#1877F2] text-2xl">
        <i class="fa-brands fa-facebook-f"></i>
      </button>
    </div>

    <!-- Bagian SIGN UP (Sesuai Permintaanmu) -->
    <div class="text-center">
      <p class="text-sm text-gray-600">
        Don't have an account? 
        <a href="#" class="font-bold text-blue-600 hover:underline">Sign Up</a>
      </p>
    </div>

    <!-- Footer Text -->
    <div class="text-center mt-10">
      <p class="text-[10px] tracking-[0.3em] text-gray-500 uppercase font-semibold">Play • Compete • Grow Together</p>
      <p class="text-[9px] tracking-[0.2em] text-gray-400 mt-2 uppercase">More Than A Game</p>
    </div>

  </div>

</body>
</html>
