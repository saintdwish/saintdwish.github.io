<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saint D. Wish - Home</title>
  <!-- Google Fonts untuk font elegan -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .font-title { font-family: 'Cinzel', serif; }
    
    /* Efek Latar Belakang Luar Angkasa */
    .space-bg {
      background: radial-gradient(circle at center, #0b1a35 0%, #030712 100%);
    }

    /* Efek Tombol Neon */
    .neon-btn {
      background: rgba(10, 25, 50, 0.4);
      border: 2px solid #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5), inset 0 0 15px rgba(59, 130, 246, 0.3);
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }
    .neon-btn:hover {
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.8), inset 0 0 20px rgba(59, 130, 246, 0.5);
      background: rgba(10, 25, 50, 0.6);
    }

    /* Efek Teks Metalik */
    .metal-text {
      background: linear-gradient(to bottom, #ffffff, #a0b8d6, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="space-bg text-white min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

  <!-- BACKGROUND GAMBAR (Ganti URL di bawah dengan link gambar luar angkasa kamu) -->
  <div class="absolute inset-0 z-0 opacity-50 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2048&auto=format&fit=crop');"></div>

  <!-- Konten Utama -->
  <div class="relative z-10 w-full max-w-md px-8 flex flex-col items-center">
    
    <!-- LOGO 3D (Ganti src dengan link gambar logo kamu) -->
    <div class="w-48 h-48 mb-6 flex justify-center items-center rounded-full shadow-[0_0_40px_rgba(59,130,246,0.5)] overflow-hidden border border-blue-500/30">
        <!-- Sementara pakai gambar placeholder, nanti ganti dengan logo aslimu -->
        <img src="https://cdn-icons-png.flaticon.com/512/3233/3233209.png" alt="Logo" class="w-32 h-32 object-contain opacity-80">
    </div>

    <!-- Judul -->
    <h1 class="font-title text-4xl md:text-5xl font-bold metal-text tracking-widest text-center mb-10">
      SAINT D. WISH
    </h1>

    <!-- Tombol Login -->
    <a href="#" class="neon-btn w-full py-4 rounded-full flex items-center justify-between px-8 mb-6 group">
      <span class="font-title text-xl tracking-wider mx-auto text-blue-100">Login</span>
      <div class="w-8 h-8 rounded-full border border-blue-300 flex items-center justify-center group-hover:bg-blue-500/30 transition">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </div>
    </a>

    <!-- Teks Divider -->
    <div class="flex items-center w-full mb-6">
      <div class="flex-1 h-px bg-blue-500/30"></div>
      <span class="px-4 text-sm text-blue-200 tracking-widest font-light">Belum Punya Akun ?</span>
      <div class="flex-1 h-px bg-blue-500/30"></div>
    </div>

    <!-- Tombol Sign In (Mengarah ke signup.html) -->
    <a href="signup.html" class="neon-btn w-full py-4 rounded-full flex items-center justify-center mb-16">
      <span class="font-title text-xl tracking-wider text-blue-100">Sign in</span>
    </a>

    <!-- Footer -->
    <div class="text-center">
      <p class="font-title text-sm tracking-[0.3em] text-blue-300/70">SAINT D. WISH</p>
    </div>

  </div>
</body>
</html>
