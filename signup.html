<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saint D. Wish - Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .font-title { font-family: 'Cinzel', serif; }
    
    /* Efek Latar Belakang Luar Angkasa */
    .space-bg {
      background: radial-gradient(circle at center, #0b1a35 0%, #030712 100%);
    }

    /* Efek Input Neon */
    .neon-input {
      background: rgba(10, 25, 50, 0.5);
      border: 2px solid #2563eb;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.4), inset 0 0 10px rgba(37, 99, 235, 0.2);
      backdrop-filter: blur(5px);
      border-radius: 9999px; /* Membuat bentuk kapsul */
    }
    
    .neon-input input {
      background: transparent;
      outline: none;
      color: white;
      width: 100%;
    }
    .neon-input input::placeholder { color: #94a3b8; }

    /* Efek Tombol Neon */
    .neon-btn {
      background: rgba(10, 25, 50, 0.4);
      border: 2px solid #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5), inset 0 0 15px rgba(59, 130, 246, 0.3);
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }
    .neon-btn:hover {
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.8), inset 0 0 20px rgba(59, 130, 246, 0.5);
    }

    .metal-text {
      background: linear-gradient(to bottom, #ffffff, #a0b8d6, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="space-bg text-white min-h-screen flex flex-col items-center relative overflow-x-hidden py-10">

  <!-- BACKGROUND GAMBAR (Ganti URL di bawah dengan link gambar luar angkasa kamu) -->
  <div class="fixed inset-0 z-0 opacity-40 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2048&auto=format&fit=crop');"></div>

  <!-- Konten Utama -->
  <div class="relative z-10 w-full max-w-md px-6 flex flex-col items-center">
    
    <!-- LOGO (Bisa pakai logo kecil) -->
    <div class="w-24 h-24 mb-4 flex justify-center items-center rounded-full shadow-[0_0_30px_rgba(59,130,246,0.5)] overflow-hidden border border-blue-500/30">
        <img src="logo.png" alt="Logo" class="w-full h-full object-cover">
    </div>

    <!-- Judul -->
    <h1 class="font-title text-2xl md:text-3xl font-bold metal-text tracking-widest text-center mb-10 flex items-center gap-3">
      <span class="text-xl">Sign Up</span> 
      <span class="text-blue-400">|</span> 
      SAINT D. WISH
    </h1>

    <!-- FORM PENDAFTARAN -->
    <form action="#" method="POST" class="w-full flex flex-col gap-4">
      
      <!-- Email -->
      <div class="neon-input flex items-center px-5 py-3 w-full">
        <i class="fa-solid fa-envelope text-blue-300 w-6 text-lg"></i>
        <div class="w-px h-6 bg-blue-500/50 mx-3"></div>
        <input type="email" placeholder="Email" required>
      </div>

      <!-- Password -->
      <div class="neon-input flex items-center px-5 py-3 w-full">
        <i class="fa-solid fa-lock text-blue-300 w-6 text-lg"></i>
        <div class="w-px h-6 bg-blue-500/50 mx-3"></div>
        <input type="password" placeholder="Password" required>
      </div>

      <!-- Nama Depan -->
      <div class="neon-input flex items-center px-5 py-3 w-full">
        <i class="fa-solid fa-user text-blue-300 w-6 text-lg"></i>
        <div class="w-px h-6 bg-blue-500/50 mx-3"></div>
        <input type="text" placeholder="Nama Depan" required>
      </div>

      <!-- Nama Belakang -->
      <div class="neon-input flex items-center px-5 py-3 w-full">
        <i class="fa-solid fa-user text-blue-300 w-6 text-lg"></i>
        <div class="w-px h-6 bg-blue-500/50 mx-3"></div>
        <input type="text" placeholder="Nama Belakang" required>
      </div>

      <!-- Broker -->
      <div class="neon-input flex items-center px-5 py-3 w-full">
        <i class="fa-solid fa-handshake text-blue-300 w-6 text-lg"></i>
        <div class="w-px h-6 bg-blue-500/50 mx-3"></div>
        <input type="text" placeholder="Broker" required>
      </div>

      <!-- No ID Akun -->
      <div class="neon-input flex items-center px-5 py-3 w-full">
        <i class="fa-regular fa-id-card text-blue-300 w-6 text-lg"></i>
        <div class="w-px h-6 bg-blue-500/50 mx-3"></div>
        <input type="text" placeholder="No ID Akun" required>
      </div>

      <!-- ID Meta Trader -->
      <div class="neon-input flex items-center px-5 py-3 w-full">
        <i class="fa-solid fa-chart-line text-blue-300 w-6 text-lg"></i>
        <div class="w-px h-6 bg-blue-500/50 mx-3"></div>
        <input type="text" placeholder="ID Meta Trader 4/ Meta Trader 5" required>
      </div>

      <!-- Tombol Continue -->
      <button type="submit" class="neon-btn w-full py-4 rounded-full flex items-center justify-between px-8 mt-6 group">
        <span class="font-title text-xl tracking-wider mx-auto text-blue-100">Continue</span>
        <div class="w-8 h-8 rounded-full border border-blue-300 flex items-center justify-center group-hover:bg-blue-500/30 transition">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </div>
      </button>

    </form>
  </div>
</body>
</html>
