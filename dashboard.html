  <script>
    // URL API
    const API_URL_USER = "https://script.google.com/macros/s/AKfycbzMYg1pTNUbEJWJSKtwifnPkw-tTn1SjFJqK2fmVepWVKpAvupB2c5eCb-fpUXR6LK-wg/exec";
    const API_URL_PRICE = "https://script.google.com/macros/s/AKfycbzZuDUnA32CUSdU194CFo4MXBFk621PFfTeAlrY0IjJB7U2LHwEepP4dLvmDFsKxiCZ/exec";
    const API_URL_SIGNAL = "https://script.google.com/macros/s/AKfycbyd8ksBWqhE6iIT1E6IT_l1TgZO86ZLgUDDpZYxb6TzZ5TMFj93Vm10wasIgrTP3_Sx/exec";
    
    // URL VPS NGROK KAMU
    const API_URL_VPS = "https://enviable-umbilical-erupt.ngrok-free.dev"; 

    let globalSignals = [];
    let currentEATab = 'GLDN'; 
    let knownSignalStatuses = {}; 
    let currentUserRole = "NO ROLE";
    let currentUserEmail = "";
    let priceHistory = []; 

    // --- SETUP CHART.JS ---
    const ctx = document.getElementById('miniChart').getContext('2d');
    const priceChart = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ data: [], borderColor: '#4ade80', borderWidth: 2, pointRadius: 0, fill: false, tension: 0.4 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } }, scales: { x: { display: false }, y: { display: false } }, animation: false }
    });

    // --- HARGA LIVE ---
    let previousPrice = 0;
    async function fetchLivePrice() {
      try {
        const res = await fetch(API_URL_PRICE); const data = await res.json();
        if (data.status === 'success' && data.price > 0) {
          const p = parseFloat(data.price);
          document.getElementById('goldPrice').innerText = p.toFixed(3);
          
          const chg = ((p - (previousPrice || p)) / p) * 100;
          document.getElementById('priceChange').innerText = (chg > 0 ? '+' : '') + chg.toFixed(2) + ' %';
          
          priceHistory.push(p);
          if(priceHistory.length > 20) priceHistory.shift();
          
          priceChart.data.labels = priceHistory.map((_, i) => i);
          priceChart.data.datasets[0].data = priceHistory;
          
          if(priceHistory.length > 1) {
            priceChart.options.scales.y.min = Math.min(...priceHistory) - 0.5;
            priceChart.options.scales.y.max = Math.max(...priceHistory) + 0.5;
          }
          
          priceChart.update();
          previousPrice = p;
        }
      } catch (e) {}
    }

    // --- FETCH & RENDER SINYAL ---
    async function fetchSignals() {
      try {
        const res = await fetch(API_URL_SIGNAL); const data = await res.json();
        if (data.status === 'success') {
          globalSignals = data.data;
          checkNewNotifications(); 
          renderAllViews();
        }
      } catch (e) {}
    }

    // --- LOGIKA NOTIFIKASI HP ---
    function checkNewNotifications() {
      if (!("Notification" in window) || Notification.permission !== "granted") return;

      globalSignals.forEach(sig => {
        const uniqueKey = sig.id + "_" + sig.status;
        if (!knownSignalStatuses[uniqueKey]) {
          if (Object.keys(knownSignalStatuses).length > 0) {
             let msg = "";
             const source = sig.source === 'GLDN' ? 'GOLDEN' : 'MSP';
             
             if (sig.status === 'WAITING') msg = `ENTRY | ${sig.arah} LIMIT ${sig.pair} | ${source}`;
             else if (sig.status === 'RUNNING') msg = `FILLED | ${sig.arah} LIMIT ${sig.pair} | ${source}`;
             else if (sig.status.includes('TP')) msg = `TAKE PROFIT ${sig.status.replace('TP','')} HIT | ${sig.arah} LIMIT ${sig.pair} | ${source}`;
             else if (sig.status === 'SL') msg = `STOP LOSS HIT | ${sig.arah} LIMIT ${sig.pair} | ${source}`;

             if (msg !== "") {
               new Notification("Saint D. Wish - Signal Update", { body: msg, icon: "logo.png" });
             }
          }
          knownSignalStatuses[uniqueKey] = true;
        }
      });
    }

    // --- RENDER SEMUA BAGIAN ---
    function renderAllViews() {
      renderDashboardCombined();
      renderVIP();
    }

    // --- LOGIKA DASHBOARD ---
    function renderDashboardCombined() {
      let historyHTML = "";
      let monProfit = 0, monLoss = 0;
      let weekProfit = 0, weekLoss = 0;
      let dayProfit = 0, dayLoss = 0;

      const now = new Date();
      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay() + (now.getDay() === 0 ? -6 : 1)); startOfWeek.setHours(0,0,0,0);
      const startOfDay = new Date(now); startOfDay.setHours(0,0,0,0);

      let count = 0;
      globalSignals.forEach(s => {
        const isBuy = s.arah === 'BUY';
        const pips = Math.abs(parseFloat(s.tp1) - parseFloat(s.entry)) * 10;
        
        if (s.status.includes('TP') || s.status === 'SL') {
          const sigDate = new Date(s.waktu);
          const isProfit = s.status !== 'SL';

          if (sigDate >= startOfMonth) { isProfit ? monProfit += pips : monLoss += pips; }
          if (sigDate >= startOfWeek) { isProfit ? weekProfit += pips : weekLoss += pips; }
          if (sigDate >= startOfDay) { isProfit ? dayProfit += pips : dayLoss += pips; }

          if (count < 5) {
            let resultText = s.status === 'SL' ? 'SL Hit' : `${s.status} Hit`;
            let resColor = s.status === 'SL' ? 'text-red-400' : 'text-green-400';
            let sourceBadge = s.source === 'GLDN' ? '<span class="text-[9px] bg-yellow-900/50 text-yellow-300 px-1 rounded ml-1">GLDN</span>' : '<span class="text-[9px] bg-purple-900/50 text-purple-300 px-1 rounded ml-1">MSP</span>';

            historyHTML += `
              <div class="border border-blue-500/30 rounded-xl p-3 flex justify-between items-center bg-[#0b1a35]/50 mb-2">
                <div class="flex items-center gap-2">
                  <i class="fa-solid fa-arrow-${isBuy ? 'up' : 'down'} ${isBuy ? 'text-green-500' : 'text-red-500'}"></i>
                  <span class="text-sm ${isBuy ? 'text-green-400' : 'text-red-400'} font-semibold">${s.arah} ${sourceBadge}</span>
                </div>
                <div class="text-right">
                  <p class="text-xs ${resColor} font-bold">${resultText}</p>
                  <p class="text-[10px] text-gray-400">+${pips} Pips</p>
                </div>
              </div>`;
            count++;
          }
        }
      });

      if (historyHTML === "") historyHTML = '<p class="text-center text-sm text-gray-400 py-4">Belum ada riwayat.</p>';
      document.getElementById('dashboard-history-list').innerHTML = historyHTML;

      document.getElementById('mon-profit').innerText = `+${monProfit}`; document.getElementById('mon-sl').innerText = `-${monLoss}`;
      document.getElementById('mon-total').innerText = (monProfit - monLoss >= 0 ? '+' : '') + (monProfit - monLoss);
      
      document.getElementById('week-profit').innerText = `+${weekProfit}`; document.getElementById('week-sl').innerText = `-${weekLoss}`;
      document.getElementById('week-total').innerText = (weekProfit - weekLoss >= 0 ? '+' : '') + (weekProfit - weekLoss);

      document.getElementById('day-profit').innerText = `+${dayProfit}`; document.getElementById('day-sl').innerText = `-${dayLoss}`;
      document.getElementById('day-total').innerText = (dayProfit - dayLoss >= 0 ? '+' : '') + (dayProfit - dayLoss);
    }

    // --- LOGIKA VIP ZONE ---
    function switchEATab(source) {
      currentEATab = source;
      document.getElementById('tab-gldn').className = `tab-btn ${source === 'GLDN' ? 'tab-active' : 'tab-inactive'}`;
      document.getElementById('tab-msp').className = `tab-btn ${source === 'MSP' ? 'tab-active' : 'tab-inactive'}`;
      renderVIP();
    }

    function renderVIP() {
      let runningHTML = "", waitingHTML = "";
      let vipDayProfit = 0, vipDayLoss = 0;
      const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);

      const filteredSignals = globalSignals.filter(s => s.source === currentEATab);

      filteredSignals.forEach(s => {
        const isBuy = s.arah === 'BUY';
        const colorClass = isBuy ? 'text-green-400' : 'text-red-400';
        const pips = Math.abs(parseFloat(s.tp1) - parseFloat(s.entry)) * 10;

        if (s.status.includes('TP') || s.status === 'SL') {
          if (new Date(s.waktu) >= startOfDay) {
            s.status === 'SL' ? vipDayLoss += pips : vipDayProfit += pips;
          }
        }

        if (s.status === 'RUNNING') {
          runningHTML += `
            <div class="glass-card p-4 border border-blue-500/40 relative overflow-hidden mb-3">
              <div class="flex justify-between items-start mb-2">
                <div class="flex items-center gap-2">
                  <span class="${colorClass} text-lg">│</span>
                  <span class="${colorClass} font-semibold text-md">${s.arah} <span class="text-gray-300 font-normal">Limit ${s.entry}</span></span>
                </div>
                <div class="text-right text-[10px]">
                  <p class="text-gray-300 font-semibold mb-1"><span class="text-red-400">🎯</span> TAKE PROFIT</p>
                  <p class="text-gray-200">🎖 TP1: ${s.tp1}</p><p class="text-gray-200">🎖 TP2: ${s.tp2}</p>
                  <p class="text-gray-200">🎖 TP3: ${s.tp3}</p>${s.tp4 != "0" && s.tp4 != "0.0" ? `<p class="text-gray-200">🏆 TP4: ${s.tp4}</p>` : ''}
                </div>
              </div>
              <p class="text-red-400 font-bold text-xs">STOP LOSS (SL) : ${s.sl}</p>
            </div>`;
        } else if (s.status === 'WAITING') {
          waitingHTML += `
            <div class="glass-card overflow-hidden border border-blue-500/30 mb-2">
              <div class="card-header p-3 flex justify-between items-center" onclick="toggleAccordion(this)">
                <div class="flex items-center gap-2">
                  <span class="${colorClass} text-sm">│</span>
                  <span class="${colorClass} font-semibold text-sm">${s.arah} <span class="text-gray-300 font-normal">Limit ${s.entry}</span></span>
                </div>
                <span class="text-gray-300 text-xs">SL: ${s.sl}</span>
              </div>
              <div class="card-detail px-3 pb-3">
                <div class="pt-3 border-t border-blue-500/30">
                  <div class="flex justify-between items-start">
                    <div>
                      <p class="text-red-400 font-bold text-xs">STOP LOSS: ${s.sl}</p>
                    </div>
                    <div class="text-right text-[10px]">
                      <p class="text-gray-300 font-semibold mb-1"><span class="text-red-400">🎯</span> TAKE PROFIT</p>
                      <p class="text-gray-200">🎖 TP1: ${s.tp1}</p><p class="text-gray-200">🎖 TP2: ${s.tp2}</p>
                      <p class="text-gray-200">🎖 TP3: ${s.tp3}</p>${s.tp4 != "0" && s.tp4 != "0.0" ? `<p class="text-gray-200">🏆 TP4: ${s.tp4}</p>` : ''}
                    </div>
                  </div>
                </div>
              </div>
            </div>`;
        }
      });

      document.getElementById('vip-running-list').innerHTML = runningHTML || '<p class="text-sm text-gray-400">Tidak ada posisi running.</p>';
      document.getElementById('vip-waiting-list').innerHTML = waitingHTML || '<p class="text-sm text-gray-400">Tidak ada sinyal waiting.</p>';
      
      document.getElementById('vip-day-profit').innerText = `+${vipDayProfit}`;
      document.getElementById('vip-day-sl').innerText = `-${vipDayLoss}`;
      document.getElementById('vip-day-total').innerText = (vipDayProfit - vipDayLoss >= 0 ? '+' : '') + (vipDayProfit - vipDayLoss);
    }

    function toggleAccordion(headerElement) {
      const detail = headerElement.nextElementSibling;
      if (detail.classList.contains('open')) {
        detail.classList.remove('open');
      } else {
        document.querySelectorAll('.card-detail').forEach(el => el.classList.remove('open'));
        detail.classList.add('open');
      }
    }

    // --- INISIALISASI & CEK TOKEN VPS ---
    document.addEventListener("DOMContentLoaded", function() {
      const token = localStorage.getItem('sdw_token');
      
      if (!token) {
        window.location.href = "login.html";
        return;
      }

      // Cek Tiket ke VPS
      fetch(`${API_URL_VPS}/api/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token })
      })
      .then(res => res.json())
      .then(data => {
          if (data.status !== 'success') {
              localStorage.removeItem('sdw_token');
              window.location.href = "login.html";
          } else {
              // Tiket Valid, muat UI
              let username = data.user.username;
              currentUserRole = data.user.role; 
              currentUserEmail = data.user.email;
              
              document.getElementById('userPP').innerText = username.charAt(0).toUpperCase();
              document.getElementById('userName').innerText = username;
              document.getElementById('userRoleDisplay').innerText = currentUserRole;
              
              if(currentUserRole === 'VIP' || currentUserRole === 'ADMIN') document.getElementById('userRoleDisplay').className = "text-sm font-bold text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.6)]";
              else document.getElementById('userRoleDisplay').className = "text-sm font-bold text-gray-400";
              
              if(currentUserRole === 'ADMIN') {
                document.getElementById('adminBtn').classList.remove('hidden');
                document.getElementById('adminTestNotifPanel').classList.remove('hidden');
              }
              
              if (Notification.permission === "granted") document.getElementById('toggleNotif').checked = true;

              document.getElementById('editUsername').value = username;
              document.getElementById('editPP').innerText = username.charAt(0).toUpperCase();
              loadAvatar();

              // Mulai ambil data
              fetchLivePrice(); setInterval(fetchLivePrice, 5000);
              fetchSignals(); setInterval(fetchSignals, 10000);
          }
      })
      .catch(() => {
          alert("Koneksi VPS terputus (Cek Ngrok/Node.js).");
      });
    });

    function loadAvatar() {
      const savedAvatar = localStorage.getItem('db_avatar');
      const mainPP = document.getElementById('userPP');
      const mainImg = document.getElementById('userAvatarImg');
      const editPP = document.getElementById('editPP');
      const editImg = document.getElementById('editAvatarImg');

      if (savedAvatar) {
        if(mainImg && mainPP) { mainImg.src = savedAvatar; mainImg.classList.remove('hidden'); mainPP.classList.add('hidden'); }
        if(editImg && editPP) { editImg.src = savedAvatar; editImg.classList.remove('hidden'); editPP.classList.add('hidden'); }
      } else {
        if(mainImg && mainPP) { mainImg.classList.add('hidden'); mainPP.classList.remove('hidden'); }
        if(editImg && editPP) { editImg.classList.add('hidden'); editPP.classList.remove('hidden'); }
      }
    }

    function handleAvatarUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        localStorage.setItem('db_avatar', e.target.result);
        loadAvatar();
      };
      reader.readAsDataURL(file);
    }

    function openSubAkun(subName) {
      document.getElementById('view-akun').classList.add('hidden');
      document.getElementById('sub-' + subName).classList.remove('hidden');
      document.getElementById('mainNavbar').classList.add('opacity-0', 'pointer-events-none');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeSubAkun() {
      document.getElementById('sub-bantuan').classList.add('hidden');
      document.getElementById('sub-password').classList.add('hidden');
      document.getElementById('sub-notif').classList.add('hidden');
      document.getElementById('sub-editprofil').classList.add('hidden');
      
      document.getElementById('view-akun').classList.remove('hidden');
      document.getElementById('mainNavbar').classList.remove('opacity-0', 'pointer-events-none');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchView(viewName, btnElement) {
      document.querySelectorAll('.view-section').forEach(view => { view.classList.add('hidden'); view.classList.remove('block'); });
      document.getElementById('view-' + viewName).classList.remove('hidden');
      document.getElementById('view-' + viewName).classList.add('block');

      if (viewName === 'vip') {
        const vipContent = document.getElementById('vip-content'); const vipOverlay = document.getElementById('vip-lock-overlay');
        if (currentUserRole === 'VIP' || currentUserRole === 'ADMIN') { vipContent.classList.remove('vip-blurred'); vipOverlay.classList.add('hidden'); } 
        else { vipContent.classList.add('vip-blurred'); vipOverlay.classList.remove('hidden'); }
      }

      const navButtons = document.querySelectorAll('nav button');
      navButtons.forEach(btn => { btn.classList.remove('text-blue-300', 'drop-shadow-md'); btn.classList.add('text-gray-400'); });
      if (viewName === 'vip') btnElement.classList.add('scale-110', 'border-white'); 
      else { btnElement.classList.remove('text-gray-400'); btnElement.classList.add('text-blue-300', 'drop-shadow-md'); }
      if(viewName !== 'vip') document.getElementById('nav-vip').classList.remove('scale-110', 'border-white');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function logout() { 
      localStorage.removeItem('sdw_token'); 
      window.location.href = "login.html"; 
    }
  </script>
