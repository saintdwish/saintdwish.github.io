<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saint D. Wish - Login Form</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #040812; color: #ffffff; }
    
    /* Animasi Aurora */
    body::before {
      content: "";
      position: fixed;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(29, 78, 216, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #040812 100%);
      z-index: -1;
      animation: auroraMove 20s ease-in-out infinite alternate;
    }
    @keyframes auroraMove {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.1) rotate(5deg); }
    }

    .glass-card {
      background: rgba(15, 25, 50, 0.5); backdrop-filter: blur(12px);
      border: 1px solid rgba(59, 130, 246, 0.2); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    .neon-input {
      background: rgba(10, 25, 50, 0.5); border: 1px solid rgba(59, 130, 246, 0.3);
      backdrop-filter: blur(5px); border-radius: 12px; transition: all 0.3s ease;
    }
    .neon-input:focus-within {
      border-color: #60a5fa; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
    }
    .neon-input input { background: transparent; outline: none; color: white; width: 100%; font-size: 14px; }
    .neon-input input::placeholder { color: #64748b; }
    
    .btn-gradient {
      background: linear-gradient(135deg, #1e40af, #3b82f6); border: 1px solid #60a5fa;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); transition: all 0.3s ease;
    }
    .btn-gradient:hover { box-shadow: 0 0 25px rgba(59, 130, 246, 0.6); transform: scale(1.02); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

  <div class="relative z-10 w-full max-w-sm px-8 py-10 glass-card rounded-2xl">
    
    <div class="w-28 mx-auto mb-6 flex justify-center">
        <img src="logo.png" alt="Logo" class="w-full h-auto object-contain drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]">
    </div>

    <h1 class="text-center text-xl font-bold tracking-widest text-white mb-8">WELCOME BACK</h1>

    <form id="loginForm" class="flex flex-col gap-4">
      
      <div class="neon-input flex items-center px-4 py-3 w-full">
        <i class="fa-regular fa-user text-blue-400 w-5 text-center"></i>
        <div class="w-px h-5 bg-blue-500/30 mx-3"></div>
        <input type="text" id="loginUser" placeholder="EMAIL / USERNAME" required>
      </div>

      <div class="neon-input flex items-center px-4 py-3 w-full">
        <i class="fa-solid fa-lock text-blue-400 w-5 text-center"></i>
        <div class="w-px h-5 bg-blue-500/30 mx-3"></div>
        <input type="password" id="loginPass" placeholder="PASSWORD" required>
        <i class="fa-regular fa-eye text-gray-500 cursor-pointer hover:text-white transition-colors" onclick="togglePassword('loginPass', this)"></i>
      </div>

      <p id="errorMsg" class="text-red-400 text-xs text-center hidden mt-1">Email/Username atau Password salah!</p>

      <button type="submit" id="btnLogin" class="btn-gradient w-full py-3 rounded-xl mt-4">
        <span class="text-sm font-bold tracking-wider text-white">Login</span>
      </button>
    </form>
    
    <div class="text-center mt-6">
       <a href="signup.html" class="text-xs text-blue-400 hover:text-white transition">Belum punya akun? Sign Up di sini</a>
    </div>

    <p class="text-center text-[10px] tracking-[0.3em] text-gray-500 mt-8">SAINT D. WISH</p>
  </div>

  <script>
    // URL VPS NGROK KAMU
    const API_URL_VPS = "https://enviable-umbilical-erupt.ngrok-free.dev"; 

    function togglePassword(inputId, iconElement) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        iconElement.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = "password";
        iconElement.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnLogin');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
      btn.disabled = true;

      const email = document.getElementById('loginUser').value;
      const password = document.getElementById('loginPass').value;
      const errMsg = document.getElementById('errorMsg');
      errMsg.classList.add('hidden');

      try {
        const response = await fetch(`${API_URL_VPS}/api/login`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true' // Mencegah blokir Ngrok
          },
          body: JSON.stringify({ email: email, password: password })
        });
        
        const data = await response.json();

        if (data.status === 'success') {
          localStorage.setItem('sdw_token', data.token);
          localStorage.setItem('db_user', data.user.username);
          localStorage.setItem('db_email', data.user.email);
          localStorage.setItem('db_role', data.user.role);

          window.location.href = "dashboard.html";
        } else {
          errMsg.classList.remove('hidden');
          errMsg.innerText = data.message;
        }
      } catch (error) {
        alert("Koneksi VPS terputus. Pastikan Ngrok & Node.js menyala.");
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
