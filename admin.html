<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saint D. Wish - Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #030712; color: white; }
    .font-title { font-family: 'Cinzel', serif; }
    .glass-card { background: rgba(11, 26, 53, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(59, 130, 246, 0.4); border-radius: 16px; }
  </style>
</head>
<body class="min-h-screen p-6 relative">

  <div class="fixed inset-0 z-0 opacity-30 bg-cover bg-center" style="background-image: url('bg.jpg');"></div>

  <!-- LAYAR TERKUNCI -->
  <div id="lockScreen" class="relative z-10 glass-card p-8 max-w-sm mx-auto mt-20 text-center hidden">
    <i class="fa-solid fa-shield-halved text-5xl text-red-500 mb-4"></i>
    <h1 class="text-xl font-bold text-red-400 mb-2">AKSES DITOLAK</h1>
    <p class="text-sm text-gray-400 mb-6">Halaman ini hanya untuk Admin. Login sebagai Admin untuk mengakses.</p>
    <a href="dashboard.html" class="text-xs text-blue-300 hover:underline">Kembali ke Dashboard</a>
  </div>

  <!-- KONTEN ADMIN -->
  <div id="adminContent" class="relative z-10 max-w-2xl mx-auto hidden">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-title tracking-wider text-blue-100">ADMIN DATABASE</h1>
      <a href="dashboard.html" class="w-10 h-10 glass-card rounded-full flex items-center justify-center hover:bg-blue-900/50 transition">
        <i class="fa-solid fa-xmark text-gray-300"></i>
      </a>
    </div>

    <div class="glass-card p-5">
      <button onclick="loadUsers()" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-lg mb-4 text-sm font-bold transition">
        <i class="fa-solid fa-rotate-right mr-2"></i> Refresh Data User
      </button>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="border-b border-blue-500/50">
            <tr>
              <th class="py-2">Username</th>
              <th class="py-2">Email</th>
              <th class="py-2">Role</th>
              <th class="py-2 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="userTable">
            <tr><td colspan="4" class="text-center py-4 text-gray-400">Klik Refresh untuk memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzMYg1pTNUbEJWJSKtwifnPkw-tTn1SjFJqK2fmVepWVKpAvupB2c5eCb-fpUXR6LK-wg/exec";

    document.addEventListener("DOMContentLoaded", function() {
      let role = localStorage.getItem('db_role');
      if (role === 'ADMIN') {
        document.getElementById('lockScreen').classList.add('hidden');
        document.getElementById('adminContent').classList.remove('hidden');
        loadUsers();
      } else {
        document.getElementById('lockScreen').classList.remove('hidden');
        document.getElementById('adminContent').classList.add('hidden');
      }
    });

    async function loadUsers() {
      const tbody = document.getElementById('userTable');
      tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4"><i class="fa-solid fa-spinner fa-spin"></i> Memuat data...</td></tr>';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'get_users' })
        });
        const data = await response.json();

        if (data.status === 'success') {
          tbody.innerHTML = '';
          data.users.forEach(user => {
            const tr = document.createElement('tr');
            tr.className = "border-b border-gray-700 hover:bg-blue-900/20";
            
            let roleColor = user.role === 'ADMIN' ? 'text-red-400' : (user.role === 'VIP' ? 'text-yellow-400' : 'text-gray-400');

            tr.innerHTML = `
              <td class="py-3">${user.username}</td>
              <td class="py-3 text-gray-400">${user.email}</td>
              <td class="py-3 font-bold ${roleColor}">${user.role}</td>
              <td class="py-3 text-center">
                <select onchange="changeRole('${user.email}', this.value)" class="bg-gray-800 text-white text-xs p-1 rounded border border-gray-600 outline-none">
                  <option value="NO ROLE" ${user.role === 'NO ROLE' ? 'selected' : ''}>NO ROLE</option>
                  <option value="VIP" ${user.role === 'VIP' ? 'selected' : ''}>VIP</option>
                  <option value="ADMIN" ${user.role === 'ADMIN' ? 'selected' : ''}>ADMIN</option>
                </select>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-red-500 py-4">Gagal memuat data. Cek URL API.</td></tr>';
      }
    }

    async function changeRole(email, newRole) {
      if(confirm(`Yakin ingin mengubah role ${email} menjadi ${newRole}?`)) {
        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'update_role', targetEmail: email, newRole: newRole })
          });
          const data = await response.json();
          if(data.status === 'success') {
            alert("Role berhasil diubah!");
            loadUsers();
          }
        } catch (error) {
          alert("Gagal mengubah role.");
        }
      }
    }
  </script>
</body>
</html>
